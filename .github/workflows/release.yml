name: release

# Push a tag like v0.2.0. This workflow:
#  1. checks that cli/package.json has the same version, runs typecheck, tests and the build
#  2. publishes the CLI to npm (when the NPM_TOKEN secret is set), with provenance
#  3. creates a GitHub release with the package tarball
#  4. moves the major tag (v0, v1, ...) to a commit that includes the built CLI, so
#     `uses: theorjiugovictor/breadth@v0` runs without building breadth on every pull request
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p 'require("./cli/package.json").version')
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME but cli/package.json is $have: bump it first (npm version $want -w cli --no-git-tag-version)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack
        run: npm pack -w cli --pack-destination "$RUNNER_TEMP"
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN is not set: skipping npm"; exit 0; fi
          npm publish -w cli --provenance --access public
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/*.tgz --generate-notes --verify-tag
      - name: Move the major tag to a build of this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add -f cli/dist
          git commit -m "breadth $GITHUB_REF_NAME (built for the GitHub Action)"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
