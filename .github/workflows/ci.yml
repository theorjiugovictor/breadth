name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the CLI on the demo
        run: |
          node cli/dist/breadth.mjs scan examples/shop -o /tmp/shop.json
          node cli/dist/breadth.mjs import-traces examples/shop/traces/checkout.otlp.json --merge /tmp/shop.json
          node cli/dist/breadth.mjs validate /tmp/shop.json
