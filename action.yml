name: breadth PR map
description: "Comment on pull requests with what the change does in behaviour (new database writes, external API calls, endpoints, removed paths, new loops doing I/O, infrastructure opened to the internet or destroyed), with a picture."
author: breadth
branding:
  icon: git-pull-request
  color: orange

inputs:
  mode:
    description: "diff (default): comment with what the change does. review: record the pull request's changes as reviewed in .breadth/ledger.json and push the ledger to the branch (run it when a review is approved). publish: scan this repository under its name (for workspaces) and push the graph to `publish-branch`."
    default: "diff"
  path:
    description: "Folder to scan, relative to the repository root."
    default: "."
  base:
    description: "Git ref to compare with. Default: the merge base with the pull request's base branch."
    default: ""
  comment:
    description: "Post the summary as a pull request comment (updated in place on every push)."
    default: "true"
  terraform-plan:
    description: "Terraform plans in JSON (`terraform show -json tfplan > plan.json`), one per line, each `plan.json` or `dir=plan.json` for the root module in dir. Adds what applying the change replaces or destroys."
    default: ""
  check-intent:
    description: "Compare the change with what the pull request says it does (its title and description, or `intent`), with an LLM. Needs `llm-provider` and the provider's API key in the step's env (e.g. ANTHROPIC_API_KEY). Only the request and the list of behaviour changes are sent, never code."
    default: "false"
  intent:
    description: "What the change was asked to do. Default: the pull request's title and description."
    default: ""
  llm-provider:
    description: "LLM for check-intent: anthropic, openai, gemini, ollama, openrouter, ... (see `breadth llm`)."
    default: ""
  llm-model:
    description: "Model for check-intent (default: the provider's default)."
    default: ""
  live:
    description: "Live sources for production traffic on each change (blast radius): datadog, prometheus, tempo, jaeger, honeycomb or loki, comma separated, configured under sources in breadth.config.json. Keys come from the step's env (e.g. DD_API_KEY, DD_APP_KEY)."
    default: ""
  live-since:
    description: "Window of live traffic to read."
    default: "1h"
  fail-on:
    description: "Fail the check when the change has a behaviour change of this severity or higher (high, medium or low). Empty never fails."
    default: ""
  workspace:
    description: "breadth.workspace.json (path in this repository) listing the other repositories of the system. The comment then names the code in them that depends on each change."
    default: ""
  workspace-name:
    description: "This repository's name in the workspace. Default: found from the workspace file (path, git URL or the repository's name)."
    default: ""
  workspace-token:
    description: "Token that can read the workspace's other repositories (for `git` members of private repositories). The default token reads only this one."
    default: ""
  publish-branch:
    description: "mode: publish: the branch the graph is pushed to, as flowgraph.json (one commit, replaced each time). A workspace reads it as https://raw.githubusercontent.com/<owner>/<repo>/<branch>/flowgraph.json."
    default: "breadth-graph"
  github-token:
    description: "Token used to comment (and to push the ledger or the published graph)."
    default: ${{ github.token }}

outputs:
  markdown:
    description: "Path of the markdown summary."
    value: ${{ steps.map.outputs.markdown }}
  graph:
    description: "Path of the diff graph, or of the published graph in publish mode (open with `breadth serve`)."
    value: ${{ steps.map.outputs.graph || steps.publish.outputs.graph }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Build breadth
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ -f cli/dist/breadth.mjs ]; then
          # a release tag (v0, v1): the CLI is prebuilt, only its two runtime packages are needed
          node -e 'const p=require("./cli/package.json").dependencies; console.log(Object.entries(p).map(([k,v])=>k+"@"+v).join(" "))' \
            | xargs npm install --prefix cli/dist --no-save --no-package-lock --no-audit --no-fund --loglevel=error
        else
          npm ci --no-audit --no-fund --loglevel=error
          npm run build -w cli >/dev/null
        fi

    - name: Map the change
      id: map
      if: inputs.mode == 'diff' || inputs.mode == ''
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_FAIL_ON: ${{ inputs['fail-on'] }}
        INPUT_TERRAFORM_PLAN: ${{ inputs['terraform-plan'] }}
        INPUT_CHECK_INTENT: ${{ inputs['check-intent'] }}
        INPUT_INTENT: ${{ inputs.intent }}
        INPUT_LLM_PROVIDER: ${{ inputs['llm-provider'] }}
        INPUT_LLM_MODEL: ${{ inputs['llm-model'] }}
        INPUT_LIVE: ${{ inputs.live }}
        INPUT_LIVE_SINCE: ${{ inputs['live-since'] }}
        INPUT_WORKSPACE: ${{ inputs.workspace }}
        INPUT_WORKSPACE_NAME: ${{ inputs['workspace-name'] }}
        WORKSPACE_TOKEN: ${{ inputs['workspace-token'] }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        if [ -n "$WORKSPACE_TOKEN" ]; then
          # git members of the workspace: clone other private repositories with this token
          # (for this step only, through git's environment, not the runner's global config)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="url.https://x-access-token:${WORKSPACE_TOKEN}@github.com/.insteadOf" GIT_CONFIG_VALUE_0="https://github.com/"
          export BREADTH_GRAPH_TOKEN="${BREADTH_GRAPH_TOKEN:-$WORKSPACE_TOKEN}"
        fi
        base="$INPUT_BASE"
        if [ -z "$base" ] && [ -n "$BASE_SHA" ]; then
          # The base as the event saw it, not the branch now: if the base moved on (or the PR was
          # merged while this ran), origin/<base> already contains the change and nothing differs.
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA" >/dev/null 2>&1 || true
          base=$(git merge-base HEAD "$BASE_SHA" 2>/dev/null || echo "$BASE_SHA")
        elif [ -z "$base" ] && [ -n "$GITHUB_BASE_REF" ]; then
          git fetch --no-tags origin "$GITHUB_BASE_REF" >/dev/null 2>&1 || true
          base=$(git merge-base HEAD "origin/$GITHUB_BASE_REF" 2>/dev/null || echo "origin/$GITHUB_BASE_REF")
        fi
        plans=()
        while IFS= read -r p; do
          p="${p#"${p%%[![:space:]]*}"}"; p="${p%"${p##*[![:space:]]}"}"
          [ -n "$p" ] && plans+=(--plan "$p")
        done <<< "$INPUT_TERRAFORM_PLAN"
        intent=()
        if [ "$INPUT_CHECK_INTENT" = "true" ]; then
          req="$RUNNER_TEMP/breadth-intent.txt"
          if [ -n "$INPUT_INTENT" ]; then
            printf '%s' "$INPUT_INTENT" > "$req"
          else
            node -e 'const e=require(process.env.GITHUB_EVENT_PATH).pull_request||{}; process.stdout.write([e.title,e.body].filter(Boolean).join("\n\n"))' > "$req" || true
          fi
          if [ -s "$req" ]; then
            intent=(--intent-file "$req" ${INPUT_LLM_PROVIDER:+--llm-provider "$INPUT_LLM_PROVIDER"} ${INPUT_LLM_MODEL:+--llm-model "$INPUT_LLM_MODEL"})
          fi
        fi
        # the PR's title and description: links the spec change it names (no LLM involved)
        prtext="$RUNNER_TEMP/breadth-pr.txt"
        node -e 'const e=require(process.env.GITHUB_EVENT_PATH).pull_request||{}; process.stdout.write([e.title,e.body].filter(Boolean).join("\n\n"))' > "$prtext" 2>/dev/null || true
        md="$RUNNER_TEMP/breadth-diff.md"
        graph="$RUNNER_TEMP/breadth-diff.flowgraph.json"
        set +e
        node "$GITHUB_ACTION_PATH/cli/dist/breadth.mjs" diff "$INPUT_PATH" ${base:+--base "$base"} \
          --markdown "$md" -o "$graph" ${INPUT_FAIL_ON:+--fail-on "$INPUT_FAIL_ON"} "${plans[@]}" "${intent[@]}" --pr-text-file "$prtext" ${INPUT_LIVE:+--live "$INPUT_LIVE" --since "$INPUT_LIVE_SINCE"} \
          ${INPUT_WORKSPACE:+--workspace "$INPUT_WORKSPACE"} ${INPUT_WORKSPACE_NAME:+--as "$INPUT_WORKSPACE_NAME"}
        code=$?
        set -e
        if [ "$code" != 0 ] && [ "$code" != 2 ]; then exit "$code"; fi
        cat "$md" >> "$GITHUB_STEP_SUMMARY"
        echo "markdown=$md" >> "$GITHUB_OUTPUT"
        echo "graph=$graph" >> "$GITHUB_OUTPUT"
        echo "failed=$([ "$code" = 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: (inputs.mode == 'diff' || inputs.mode == '') && inputs.comment == 'true' && github.event.pull_request
      # Pull requests from forks get a read-only token: the job summary still has the map.
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        MD: ${{ steps.map.outputs.markdown }}
      run: |
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- breadth-diff -->")) | .id' | head -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$MD" >/dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$MD" >/dev/null
        fi

    - name: Keep the diff graph
      if: inputs.mode == 'diff' || inputs.mode == ''
      uses: actions/upload-artifact@v4
      with:
        name: breadth-diff
        path: ${{ steps.map.outputs.graph }}
        if-no-files-found: ignore

    - name: Record the review
      if: inputs.mode == 'review'
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        REVIEWER: ${{ github.event.review.user.login || github.actor }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        base=""
        if [ -n "$BASE_SHA" ]; then
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA" >/dev/null 2>&1 || true
          base=$(git merge-base HEAD "$BASE_SHA" 2>/dev/null || echo "$BASE_SHA")
        elif [ -n "$BASE_REF" ]; then
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          base=$(git merge-base HEAD "origin/$BASE_REF")
        fi
        node "$GITHUB_ACTION_PATH/cli/dist/breadth.mjs" review "$INPUT_PATH" --changed ${base:+--base "$base"} --by "$REVIEWER"
        git config user.name "breadth"
        git config user.email "breadth@users.noreply.github.com"
        git add .breadth/ledger.json
        if git diff --cached --quiet; then echo "ledger unchanged"; exit 0; fi
        git commit -m "breadth: changes reviewed by $REVIEWER"
        git push

    - name: Fail on behaviour changes
      if: steps.map.outputs.failed == 'true'
      shell: bash
      run: |
        echo "::error::breadth found behaviour changes at or above '${{ inputs['fail-on'] }}' severity (see the PR comment or job summary)."
        exit 1

    - name: Publish the graph
      id: publish
      if: inputs.mode == 'publish'
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        NAME: ${{ inputs['workspace-name'] || github.event.repository.name }}
        BRANCH: ${{ inputs['publish-branch'] }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        out="$RUNNER_TEMP/breadth-publish"
        rm -rf "$out" && mkdir -p "$out"
        node "$GITHUB_ACTION_PATH/cli/dist/breadth.mjs" scan "$INPUT_PATH" --as "$NAME" -o "$out/flowgraph.json"
        echo "graph=$out/flowgraph.json" >> "$GITHUB_OUTPUT"
        # one commit on its own branch, replaced each time: nothing accumulates in the history
        cd "$out"
        git init -q
        git checkout -q -b "$BRANCH"
        git add flowgraph.json
        git -c user.name="breadth" -c user.email="breadth@users.noreply.github.com" commit -qm "breadth graph of $GITHUB_REPOSITORY at ${GITHUB_SHA::7}"
        git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
        echo "Published https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/flowgraph.json" >> "$GITHUB_STEP_SUMMARY"
