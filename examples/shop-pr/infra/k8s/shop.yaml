apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  ORDERS_URL: http://orders:8000
  PAYMENTS_URL: http://payments:9000
  KAFKA_BROKERS: kafka:9092
---
apiVersion: v1
kind: Secret
metadata:
  name: stripe
  namespace: shop
type: Opaque
stringData:
  STRIPE_KEY: replace-me
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: shop
  labels: { app: gateway }
spec:
  replicas: 3
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway, tier: edge } }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/example/shop-gateway:1.4.2
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: ORDERS_URL
              value: http://orders:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
  labels: { app: orders }
spec:
  replicas: 2
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders, tier: backend } }
    spec:
      serviceAccountName: orders
      containers:
        - name: orders
          image: ghcr.io/example/shop-orders:2.0.1
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: shop-config } }]
          env:
            - name: PAYMENTS_URL
              value: http://payments:9000
            - name: DATABASE_HOST
              value: shop-orders.cluster.eu-west-1.rds.amazonaws.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
  labels: { app: payments }
spec:
  replicas: 2
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments, tier: backend } }
    spec:
      serviceAccountName: payments
      containers:
        - name: payments
          image: ghcr.io/example/shop-payments:1.1.0
          ports: [{ name: http, containerPort: 9000 }]
          env:
            - name: STRIPE_KEY
              valueFrom: { secretKeyRef: { name: stripe, key: STRIPE_KEY } }
            - name: RECEIPTS_BUCKET
              value: shop-refund-receipts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
  namespace: shop
  labels: { app: notifier }
spec:
  replicas: 1
  selector: { matchLabels: { app: notifier } }
  template:
    metadata: { labels: { app: notifier, tier: worker } }
    spec:
      containers:
        - name: notifier
          image: ghcr.io/example/shop-notifier:0.9.0
          envFrom: [{ configMapRef: { name: shop-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: shop }
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ name: http, port: 80, targetPort: 8080, nodePort: 30080 }]
---
apiVersion: v1
kind: Service
metadata: { name: orders, namespace: shop }
spec:
  selector: { app: orders }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: payments, namespace: shop }
spec:
  selector: { app: payments }
  ports: [{ name: http, port: 9000, targetPort: 9000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: shop, namespace: shop }
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 80 } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: payments-from-orders, namespace: shop }
spec:
  podSelector: { matchLabels: { app: payments } }
  ingress:
    - from: [{ podSelector: { matchLabels: { app: orders } } }]
      ports: [{ protocol: TCP, port: 9000 }]
